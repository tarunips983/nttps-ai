  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const API_BASE = "https://smart-ai-jh7s.onrender.com";
      const token = localStorage.getItem("token");
      // Centralized unauthorized handler
      function handleUnauthorized() {
        localStorage.clear();
        window.location.replace("/login?reason=expired");
      }
      // No token → let gate handle it
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/auth/me`, {
          headers: {
            Authorization: "Bearer " + token
          }
        });
        if (res.status === 401 || res.status === 403) {
          handleUnauthorized();
          return;
        }
        if (!res.ok) {
          console.warn("Auth check failed");
          return;
        }
        const data = await res.json();
        // ✅ Correct data access
        const email = data.user.email;
        const role = data.user.role;
        const plan = data.plan;
        const initials = email.substring(0, 2).toUpperCase();
        document.getElementById("avatarText").textContent = initials;
        document.getElementById("smartUserEmail").textContent = email;
        const planBadge = document.getElementById("planBadge");
planBadge.innerHTML = ""; // clear previous content

if (role === "admin") {
  const badge = document.createElement("span");
  badge.className = "role-badge admin";
  badge.textContent = "ADMIN";
  planBadge.appendChild(badge);
} else {
  planBadge.textContent = `${plan} PLAN`;
}

        if (plan === "FREE" && role !== "admin") {
          const up = document.getElementById("upgradeBtn");
          up.classList.remove("hidden");
          up.onclick = () => window.location.href = "/plans";
        }
      } catch (err) {
        console.error("Auth error:", err);
        handleUnauthorized();
      }
      // Dropdown toggle
      const avatar = document.getElementById("smartAvatar");
      const dropdown = document.getElementById("smartUserDropdown");
      avatar.addEventListener("click", (e) => {
        e.stopPropagation();
        dropdown.classList.toggle("hidden");
      });
      document.addEventListener("click", () => {
        dropdown.classList.add("hidden");
      });
      // Logout
      document.getElementById("logoutBtn").onclick = async () => {
        try {
          await fetch(`${API_BASE}/auth/logout`, {
            method: "POST",
            headers: {
              Authorization: "Bearer " + localStorage.getItem("token")
            }
          });
        } catch (err) {
          console.warn("Logout request failed", err);
        } finally {
          localStorage.clear();
          window.location.replace("/login");
        }
      };
      // Auto-grow textarea
      const input = document.getElementById("aiInput");
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = input.scrollHeight + "px";
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          document.getElementById("aiSendBtn").click();
        }
      });

      // New Feature: Dark Mode Toggle
      const themeToggle = document.getElementById("themeToggleBtn");
      themeToggle.onclick = () => {
        const currentTheme = document.body.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.body.setAttribute("data-theme", newTheme);
        themeToggle.textContent = newTheme === "dark" ? "☀️ Toggle Light Mode" : "🌙 Toggle Dark Mode";
        localStorage.setItem("theme", newTheme);
      };
      // Load saved theme
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme) {
        document.body.setAttribute("data-theme", savedTheme);
        themeToggle.textContent = savedTheme === "dark" ? "☀️ Toggle Light Mode" : "🌙 Toggle Dark Mode";
      }

      // New Feature: Emoji Picker
      const emojiBtn = document.getElementById("emojiBtn");
      const emojiPicker = document.getElementById("emojiPicker");
      const emojis = ['😀', '😂', '❤️', '👍', '🔥', '🎉', '🤔', '😎', '🌟', '🚀']; // Example emojis
      emojis.forEach(emoji => {
        const btn = document.createElement("button");
        btn.textContent = emoji;
        btn.onclick = () => {
          input.value += emoji;
          input.focus();
          emojiPicker.classList.remove("active");
        };
        emojiPicker.appendChild(btn);
      });
      emojiBtn.onclick = () => {
        emojiPicker.classList.toggle("active");
      };

      // New Feature: Voice Input (using Web Speech API)
      const voiceBtn = document.getElementById("voiceBtn");
      const voiceRecording = document.querySelector(".voice-recording");
      if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        voiceBtn.onclick = () => {
          recognition.start();
          voiceRecording.classList.add("active");
        };
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          input.value += transcript + " ";
          input.focus();
          voiceRecording.classList.remove("active");
        };
        recognition.onerror = () => {
          voiceRecording.classList.remove("active");
          alert("Voice recognition error. Please try again.");
        };
        recognition.onend = () => {
          voiceRecording.classList.remove("active");
        };
      } else {
        voiceBtn.style.display = "none"; // Hide if not supported
      }

      // New Feature: Export Chat (added to context menu example, assuming menu exists)
      // Note: Actual export logic would need backend integration, here it's a placeholder
      document.addEventListener("click", (e) => {
        if (e.target.classList.contains("export")) {
          const chatContent = document.getElementById("aiMessages").innerText;
          const blob = new Blob([chatContent], { type: "text/plain" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "chat-export.txt";
          a.click();
          URL.revokeObjectURL(url);
        }
      });
    });
  </script>

  <script>
(() => {
  const overlay = document.getElementById("settingsOverlay");
  const openBtn = document.getElementById("openSettingsBtn");

  openBtn.onclick = () => overlay.classList.remove("hidden");
  overlay.onclick = e => {
    if(e.target === overlay) overlay.classList.add("hidden");
  };

  // Tabs
  document.querySelectorAll(".settings-tab").forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll(".settings-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".settings-panel").forEach(p => p.classList.remove("active"));

      tab.classList.add("active");
      document.getElementById("settings-" + tab.dataset.tab).classList.add("active");
    };
  });

  // Theme
  const themeSelect = document.getElementById("themeSelect");
  themeSelect.value = localStorage.getItem("theme") || "light";
  themeSelect.onchange = () => {
    const val = themeSelect.value;
    if(val === "system"){
      document.body.removeAttribute("data-theme");
    } else {
      document.body.setAttribute("data-theme", val);
    }
    localStorage.setItem("theme", val);
  };

  // Accent
  const accent = document.getElementById("accentColor");
  accent.value = localStorage.getItem("accent") || "#2563eb";
  accent.oninput = () => {
    document.documentElement.style.setProperty("--accent", accent.value);
    localStorage.setItem("accent", accent.value);
  };

  // Account info
  document.getElementById("settingsEmail").textContent =
    document.getElementById("smartUserEmail")?.textContent || "—";
  document.getElementById("settingsPlan").textContent =
    document.getElementById("planBadge")?.innerText || "—";

  // Force logout
  document.getElementById("forceLogoutBtn").onclick = () => {
